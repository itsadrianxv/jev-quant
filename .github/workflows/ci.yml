name: C++ CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build libcurl4-openssl-dev nlohmann-json3-dev

      - name: Configure
        run: >-
          cmake -S . -B build/${{ matrix.build_type }}
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build/${{ matrix.build_type }} --parallel

      - name: Test
        run: >-
          ctest --test-dir build/${{ matrix.build_type }}
          --output-on-failure
